name: Update berita

on:
  schedule:
    - cron: "17 22 * * *" # 05:17 WIB tiap hari
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil RSS
        run: python tools/news_fetch.py

      - name: Commit bila berubah
        run: |
          if git diff --quiet -- frontend/lib/news.json; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add frontend/lib/news.json
          git commit -m "data: perbarui berita $(date -u +%F)"
          git push

# Push ke main memicu build/deploy ulang (Vercel/Netlify) sehingga situs ikut segar.
